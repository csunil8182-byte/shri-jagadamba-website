<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>श्री जगदंबा फुल भंडार व इव्हेंट डेकोरेशन</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background: linear-gradient(
        135deg,
        #fff3e0,
        #ffe0b2,
        #fff8e1
    );
}

.login-container {
    width: 100%;
    max-width: 450px;
    padding: 35px 25px;

    background: rgba(255,255,255,0.96);
    border-radius: 25px;
    text-align: center;

    box-shadow: 0 15px 40px rgba(0,0,0,0.20);
}

/* LOGO */

.logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    margin-bottom: 15px;
}

/* SHOP NAME */

h1 {
    font-size: 25px;
    line-height: 1.5;
    color: #8b0000;
    margin-bottom: 10px;
}

/* WELCOME */

.welcome {
    font-size: 18px;
    font-weight: bold;
    color: #d35400;
    margin-bottom: 30px;
}

/* BUTTON */

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #8b0000,
        #e65100
    );

    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.20);
}

/* FOOTER */

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #777;
}

</style>
</head>

<body>

<div class="login-container">

    <!-- LOGO -->

    <img
        src="logo.png"
        alt="श्री जगदंबा लोगो"
        class="logo"
    >

    <!-- SHOP NAME -->

    <h1>
        श्री जगदंबा फुल भंडार
        <br>
        व इव्हेंट डेकोरेशन
    </h1>

    <!-- WELCOME -->

    <div class="welcome">
        मध्ये सहर्ष स्वागत आहे
    </div>

    <!-- DIRECT ENTRY BUTTON -->

    <button onclick="goToDashboard()">
        पुढे जा
    </button>

    <!-- FOOTER -->

    <div class="footer">
        श्री जगदंबा फुल भंडार व इव्हेंट डेकोरेशन
    </div>

</div>

<script>

function goToDashboard() {
    window.location.href = "dashboard.html";
}

</script>

</body>
</html>
